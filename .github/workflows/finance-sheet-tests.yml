name: Tests

on:
  # Runs once per PR. push is limited to main, so a merge is still checked
  # but a push to a PR branch doesn't run everything a second time.
  push:
    branches: [main]
    paths:
      - "finance-sheet/**"
      - ".github/workflows/finance-sheet-tests.yml"
  pull_request:
    paths:
      - "finance-sheet/**"
      - ".github/workflows/finance-sheet-tests.yml"

jobs:
  node-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: finance-sheet
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm test
