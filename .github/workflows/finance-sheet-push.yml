# Manual deploy: Actions ▸ "Push to Apps Script" ▸ Run workflow.
# Not triggered on push on purpose. Needs the repo secret CLASPRC_JSON (see finance-sheet/README.md).
name: Push to Apps Script
on:
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: finance-sheet   # .clasp.json lives here
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm install -g @google/clasp@3.4.1
      - name: Write clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
      - run: clasp push --force
