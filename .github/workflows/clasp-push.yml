# Manual deploy: Actions ▸ "Push to Apps Script" ▸ Run workflow.
# Not triggered on push on purpose. Needs the repo secret CLASPRC_JSON (see README).
name: Push to Apps Script
on:
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g @google/clasp@2.4.2
      - name: Write clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
      - run: clasp push --force
