name: Expense tracker

on:
  # Runs once per PR. push is limited to main, so a merge is still checked
  # but a push to a PR branch doesn't run everything a second time.
  push:
    branches: [main]
    paths:
      - "expense-tracker/**"
      - "finance-sheet/src/config/Defaults.gs"
      - ".github/workflows/expense-tracker.yml"
  pull_request:
    paths:
      - "expense-tracker/**"
      - "finance-sheet/src/config/Defaults.gs"
      - ".github/workflows/expense-tracker.yml"

jobs:
  test-and-lint:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: expense-tracker
    steps:
      - uses: actions/checkout@v6
      - name: Lint (ruff, mypy, ESLint)
        run: make lint
      - name: Test (pytest against Postgres 16, vitest)
        run: make test

  backup-script:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: expense-tracker
    steps:
      - uses: actions/checkout@v6
      - name: Install rclone and shellcheck
        run: sudo apt-get update && sudo apt-get install -y rclone shellcheck
      - name: Shellcheck
        run: shellcheck scripts/backup.sh scripts/test_backup.sh
      - name: Test the backup script (local folder instead of Drive)
        run: make backup-test
