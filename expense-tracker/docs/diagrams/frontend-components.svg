<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1000" width="1440" height="1000" font-family="-apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', Roboto, sans-serif">
  <title>Expense tracker frontend: where the components are</title>
  <defs>
    <style>
      .bg { fill: #f5f5f7; }
      .frame { fill: #ffffff; stroke: #d2d2d7; stroke-width: 1.5; }
      .box { fill: #ffffff; stroke: #86868b; stroke-width: 1; }
      .fill { fill: #e8e8ed; stroke: none; }
      .accent { fill: #e5effa; stroke: #0066cc; stroke-width: 1.2; }
      .page { fill: none; stroke: #0066cc; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .h1 { font-size: 26px; font-weight: 700; fill: #1d1d1f; letter-spacing: -0.02em; }
      .h2 { font-size: 17px; font-weight: 600; fill: #1d1d1f; }
      .t { font-size: 14px; fill: #1d1d1f; }
      .b { font-size: 14px; font-weight: 600; fill: #1d1d1f; }
      .s { font-size: 12px; fill: #6e6e73; }
      .f { font-size: 12.5px; fill: #0066cc; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .row { fill: #ffffff; stroke: #d2d2d7; stroke-width: 1; }
      .arrow { stroke: #6e6e73; stroke-width: 1.4; fill: none; marker-end: url(#a); }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6e6e73"/></marker>
  </defs>

  <rect class="bg" width="1440" height="1000"/>
  <text class="h1" x="40" y="50">Expense tracker frontend: where the components are</text>
  <text class="s" x="40" y="72">All paths are under expense-tracker/frontend/src/. Blue text = file. Dashed blue = the part that changes per page.</text>

  <!-- ============ LEFT: screen map ============ -->
  <text class="h2" x="40" y="108">1 · On screen (Dashboard shown)</text>
  <rect class="frame" x="40" y="120" width="720" height="840" rx="14"/>

  <!-- top bar -->
  <rect class="fill" x="40" y="120" width="720" height="52" rx="14"/>
  <rect class="fill" x="40" y="150" width="720" height="22"/>
  <text class="b" x="60" y="151">Top bar</text>
  <text class="f" x="124" y="151">App.tsx → Shell</text>
  <rect x="300" y="134" width="74" height="24" rx="7" fill="#ffffff"/>
  <text class="s" x="309" y="151">Dashboard</text>
  <text class="s" x="384" y="151">Transactions · Accounts · Budgets · Settings</text>
  <text class="s" x="668" y="151">Log out</text>

  <!-- quick add -->
  <rect class="accent" x="64" y="188" width="672" height="58" rx="10"/>
  <text class="b" x="80" y="212">Quick add (on every page)</text>
  <text class="f" x="80" y="232">components/QuickAdd.tsx</text>
  <text class="s" x="330" y="232">uses AccountPicker.tsx · amount · description · account · date · Add</text>

  <!-- page outlet -->
  <rect class="page" x="56" y="262" width="688" height="684" rx="12"/>
  <text class="b" x="72" y="286">Page area</text>
  <text class="f" x="146" y="286">&lt;Outlet/&gt; → pages/Dashboard.tsx</text>

  <!-- toolbar -->
  <rect class="box" x="72" y="300" width="250" height="40" rx="8"/>
  <text class="t" x="84" y="318">‹  Month  ›</text>
  <text class="f" x="84" y="333">MonthPicker.tsx</text>
  <rect class="fill" x="500" y="300" width="228" height="40" rx="8"/>
  <text class="t" x="512" y="318">Household | Just me</text>
  <text class="s" x="512" y="333">segmented control (Dashboard.tsx)</text>

  <!-- kpis -->
  <g>
    <rect class="box" x="72" y="356" width="157" height="62" rx="10"/>
    <rect class="box" x="236" y="356" width="157" height="62" rx="10"/>
    <rect class="box" x="400" y="356" width="157" height="62" rx="10"/>
    <rect class="box" x="564" y="356" width="164" height="62" rx="10"/>
    <text class="s" x="84" y="378">Income</text><text class="b" x="84" y="402">₹1,19,000</text>
    <text class="s" x="248" y="378">Spent</text><text class="b" x="248" y="402">₹30,064</text>
    <text class="s" x="412" y="378">Saved</text><text class="b" x="412" y="402" style="fill:#1f7a35">₹88,936</text>
    <text class="s" x="576" y="378">Savings rate</text><text class="b" x="576" y="402">75%</text>
  </g>
  <text class="f" x="72" y="436">Kpi.tsx × 4  (tiles)</text>

  <!-- grid-2 -->
  <rect class="box" x="72" y="450" width="322" height="110" rx="10"/>
  <text class="b" x="86" y="474">Needs attention</text>
  <text class="f" x="86" y="494">pages/Dashboard.tsx</text>
  <rect class="box" x="406" y="450" width="322" height="110" rx="10"/>
  <text class="b" x="420" y="474">Saved per month</text>
  <text class="f" x="420" y="494">TrendChart.tsx</text>
  <rect x="440" y="520" width="18" height="24" fill="#1f7a35"/><rect x="480" y="510" width="18" height="34" fill="#1f7a35"/><rect x="520" y="514" width="18" height="30" fill="#1f7a35"/>

  <!-- budget vs actual -->
  <rect class="box" x="72" y="574" width="656" height="92" rx="10"/>
  <text class="b" x="86" y="598">Budget vs actual</text>
  <text class="f" x="210" y="598">pages/Dashboard.tsx</text>
  <rect class="fill" x="250" y="616" width="400" height="8" rx="4"/><rect x="250" y="616" width="260" height="8" rx="4" fill="#1f7a35"/>
  <rect class="fill" x="250" y="638" width="400" height="8" rx="4"/><rect x="250" y="638" width="400" height="8" rx="4" fill="#d70015"/>
  <text class="s" x="86" y="624">Category › Sub</text><text class="s" x="86" y="646">Over budget = red</text>

  <!-- financial overview -->
  <rect class="box" x="72" y="680" width="656" height="250" rx="10"/>
  <text class="b" x="86" y="704">Financial overview</text>
  <text class="f" x="232" y="704">components/FinancialOverview.tsx</text>
  <rect class="fill" x="86" y="718" width="628" height="44" rx="8"/>
  <text class="s" x="100" y="744">Kpi.tsx × 8: bank · card owed · credit · net cash · invested · portfolio · income · expenses</text>
  <rect class="row" x="86" y="776" width="628" height="44" rx="8"/>
  <text class="t" x="98" y="803">🏦 Bank accounts table</text>
  <rect class="row" x="86" y="826" width="628" height="44" rx="8"/>
  <text class="t" x="98" y="853">💳 Credit cards table</text>
  <rect class="row" x="86" y="876" width="628" height="44" rx="8"/>
  <text class="t" x="98" y="903">📈 Share market brokers table</text>

  <!-- ============ RIGHT: routes ============ -->
  <text class="h2" x="800" y="108">2 · Address → page file → components it uses</text>
  <g>
    <rect class="row" x="800" y="120" width="600" height="46" rx="8"/>
    <text class="b" x="814" y="140">/</text><text class="f" x="1000" y="140">pages/Dashboard.tsx</text>
    <text class="s" x="1000" y="157">MonthPicker · Kpi · TrendChart · FinancialOverview</text>

    <rect class="row" x="800" y="172" width="600" height="46" rx="8"/>
    <text class="b" x="814" y="192">/transactions</text><text class="f" x="1000" y="192">pages/Transactions.tsx</text>
    <text class="s" x="1000" y="209">MonthPicker · CategoryPicker · Modal + TransactionForm</text>

    <rect class="row" x="800" y="224" width="600" height="46" rx="8"/>
    <text class="b" x="814" y="244">/accounts</text><text class="f" x="1000" y="244">pages/Accounts.tsx</text>
    <text class="s" x="1000" y="261">Modal + AccountForm</text>

    <rect class="row" x="800" y="276" width="600" height="46" rx="8"/>
    <text class="b" x="814" y="296">/accounts/:id</text><text class="f" x="1000" y="296">pages/AccountDetails.tsx</text>
    <text class="s" x="1000" y="313">MonthPicker · Kpi · Modal + AccountForm / TransactionForm</text>

    <rect class="row" x="800" y="328" width="600" height="46" rx="8"/>
    <text class="b" x="814" y="348">/budgets</text><text class="f" x="1000" y="348">pages/Budgets.tsx</text>
    <text class="s" x="1000" y="365">MonthPicker · BudgetSection (inside the file)</text>

    <rect class="row" x="800" y="380" width="600" height="46" rx="8"/>
    <text class="b" x="814" y="400">/settings</text><text class="f" x="1000" y="400">pages/Settings.tsx</text>
    <text class="s" x="1000" y="417">Profile · Members · Rules · Categories (CategoryPicker)</text>

    <rect class="row" x="800" y="432" width="600" height="46" rx="8"/>
    <text class="b" x="814" y="452">/admin</text><text class="f" x="1000" y="452">pages/Admin.tsx</text>
    <text class="s" x="1000" y="469">site admins only: invites · users · households · template</text>

    <rect class="row" x="800" y="484" width="600" height="46" rx="8" stroke-dasharray="4 4"/>
    <text class="b" x="814" y="504">/login · /invite · /reset</text><text class="f" x="1000" y="504">pages/Auth.tsx</text>
    <text class="s" x="1000" y="521">no top bar or quick add (outside the Shell)</text>
  </g>
  <text class="s" x="800" y="550">Routes are listed in App.tsx. Data fetching: api.ts + hooks.ts. Number and date text: format.ts.</text>

  <!-- ============ RIGHT: pop-ups ============ -->
  <text class="h2" x="800" y="590">3 · Pop-ups (open over any page)</text>
  <rect class="frame" x="800" y="602" width="600" height="160" rx="14"/>
  <text class="b" x="816" y="628">Dialog frame</text><text class="f" x="922" y="628">components/Modal.tsx</text>
  <rect class="box" x="816" y="642" width="280" height="104" rx="10"/>
  <text class="f" x="830" y="666">TransactionForm.tsx</text>
  <text class="s" x="830" y="686">type (segmented) · account · amount</text>
  <text class="s" x="830" y="704">date · category · description · notes</text>
  <text class="s" x="830" y="728">uses AccountPicker · CategoryPicker</text>
  <rect class="box" x="1106" y="642" width="278" height="104" rx="10"/>
  <text class="f" x="1120" y="666">AccountForm.tsx</text>
  <text class="s" x="1120" y="686">type · name · institution · balances</text>
  <text class="s" x="1120" y="704">card limit · due day · visibility</text>
  <text class="s" x="1120" y="728">deactivate / delete</text>

  <!-- ============ RIGHT: look and feel ============ -->
  <text class="h2" x="800" y="802">4 · Look and feel (change the design here)</text>
  <rect class="accent" x="800" y="816" width="250" height="92" rx="12"/>
  <text class="f" x="816" y="842">theme/tokens.css</text>
  <text class="s" x="816" y="862">every colour, font size, spacing,</text>
  <text class="s" x="816" y="878">radius, shadow and animation timing</text>
  <text class="s" x="816" y="894">light + dark in one line each</text>
  <path class="arrow" d="M1052 862 H1100"/>
  <rect class="box" x="1104" y="816" width="140" height="92" rx="12"/>
  <text class="f" x="1118" y="842">styles.css</text>
  <text class="s" x="1118" y="862">component styles,</text>
  <text class="s" x="1118" y="878">uses tokens only</text>
  <path class="arrow" d="M1246 862 H1278"/>
  <rect class="box" x="1282" y="816" width="118" height="92" rx="12"/>
  <text class="t" x="1294" y="856">every page</text>
  <text class="t" x="1294" y="876">and component</text>
  <text class="s" x="800" y="934">To re-theme, edit only theme/tokens.css.</text>
  <text class="s" x="800" y="952">theme/tokens.test.ts fails if a raw colour is added to styles.css.</text>
</svg>
