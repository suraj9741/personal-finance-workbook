[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# The database URL comes from the DATABASE_URL environment variable (see alembic/env.py).

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stdout,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
