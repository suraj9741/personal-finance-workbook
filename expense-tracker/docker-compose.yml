# Expense tracker: `make up` starts everything; data lives in the `pgdata` volume.
# Never run `docker compose down -v`: -v deletes the volume and all your data.
name: expense-tracker

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  APP_ENV: ${APP_ENV:-production}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  SEED_CONFIG: /config/seed.yaml

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: applies migrations, then exits. The backend starts only if this succeeds.
  # (In Kubernetes this becomes a Job / Helm hook, so replicas never race on migrations.)
  migrate:
    build: { context: ./backend, target: runtime }
    image: expense-tracker-backend:local
    pull_policy: build  # local image: build it, never look for it on Docker Hub
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  # One-shot: adds what's missing from config/seed.yaml (accounts, categories, settings).
  # Add-only, so edits made in the app are never overwritten. Runs on every `make up`.
  seed:
    image: expense-tracker-backend:local
    pull_policy: never
    command: ["python", "-m", "app.cli", "seed-config"]
    environment: *backend-env
    volumes:
      - ./config:/config:ro
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: "no"

  backend:
    image: expense-tracker-backend:local  # built by the migrate service above
    pull_policy: never
    restart: unless-stopped
    environment: *backend-env
    volumes:
      - ./config:/config:ro  # read by `make create-admin`
    depends_on:
      db: { condition: service_healthy }
      seed: { condition: service_completed_successfully }
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"

  frontend:
    build: { context: ./frontend, target: runtime }
    image: expense-tracker-frontend:local
    pull_policy: build
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    ports:
      - "0.0.0.0:${FRONTEND_PORT:-8080}:8080"

# Backups run outside Compose: scripts/backup.sh, scheduled by make backup-schedule.

volumes:
  pgdata:
