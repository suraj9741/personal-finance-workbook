# Expense tracker for a server: pulls the public images CI pushes to Docker Hub and never
# builds. The server needs only Docker, this file and a .env next to it (no clone of the
# repo). The Mac keeps using docker-compose.yml and `make up`.
#
# The server's .env (see .env.example for the rest):
#   COMPOSE_FILE=docker-compose.deploy.yml   # so plain `docker compose` uses this file
#   IMAGE_NAMESPACE=<dockerhub-user>
#   IMAGE_TAG=latest                         # or sha-<commit> to pin one build
# then: docker compose pull && docker compose up -d
#
# The project name matches docker-compose.yml, so scripts/backup.sh finds the database.
# Don't start this file on the Mac: it would replace the running containers there.
# Never run `docker compose down -v`: -v deletes the volume and all your data.
name: expense-tracker

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  APP_ENV: ${APP_ENV:-production}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  SEED_CONFIG: /config/seed.yaml

# Docker keeps container logs forever by default; a small disk fills up.
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-backend-image: &backend-image ${IMAGE_NAMESPACE:?set IMAGE_NAMESPACE in .env}/expense-tracker-backend:${IMAGE_TAG:-latest}

# Memory limits are sized for a 512 MB to 1 GB machine. The app used about 170 MiB idle
# and 300 MiB at peak on the Mac. A limit decides which container is killed when memory
# runs out, so one runaway process can't take Postgres down with it. Add swap on the host.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Smaller than Postgres' defaults (128MB shared_buffers, 100 connections). The backend
    # pool is 5 connections plus overflow, so 30 is plenty.
    command:
      - postgres
      - -c
      - shared_buffers=48MB
      - -c
      - max_connections=30
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - effective_cache_size=128MB
    mem_limit: 256m
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: applies migrations, then exits. The backend starts only if this succeeds.
  migrate:
    image: *backend-image
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    mem_limit: 320m
    logging: *logging
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  # One-shot: adds what's missing from config/seed.yaml (baked into the image).
  # Add-only, so edits made in the app win.
  seed:
    image: *backend-image
    command: ["python", "-m", "app.cli", "seed-config"]
    environment: *backend-env
    mem_limit: 320m
    logging: *logging
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: "no"

  # Not published on the host: nginx in the frontend container proxies /api to it.
  backend:
    image: *backend-image
    restart: unless-stopped
    environment: *backend-env
    mem_limit: 320m
    logging: *logging
    depends_on:
      db: { condition: service_healthy }
      seed: { condition: service_completed_successfully }

  # 127.0.0.1 by default: a server is on the public internet and the app is plain HTTP.
  # With HTTPS (the caddy service below) it stays on 127.0.0.1 and Caddy is the only thing
  # the internet reaches. FRONTEND_BIND=0.0.0.0 publishes it on the server's public IP over
  # plain HTTP: passwords then cross the internet unencrypted, so use that only as a stopgap.
  frontend:
    image: ${IMAGE_NAMESPACE:?set IMAGE_NAMESPACE in .env}/expense-tracker-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    mem_limit: 64m
    logging: *logging
    depends_on:
      backend: { condition: service_healthy }
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-8080}:8080"

  # HTTPS in front of the frontend, on only when .env has COMPOSE_PROFILES=https and
  # CADDY_DOMAIN=<name>. Caddy gets a Let's Encrypt certificate for that name by itself, renews
  # it, and redirects http:// to https://. Let's Encrypt checks the name over ports 80 and 443,
  # so both must be open to everyone in the firewall. Certificates live in the caddy_data
  # volume, so a restart doesn't ask for new ones (Let's Encrypt limits how often you may).
  caddy:
    image: caddy:2.10-alpine
    profiles: [https]
    restart: unless-stopped
    command:
      - caddy
      - reverse-proxy
      - --from
      - ${CADDY_DOMAIN:-set-CADDY_DOMAIN-in-.env}
      - --to
      - frontend:8080
    mem_limit: 64m
    logging: *logging
    depends_on:
      frontend: { condition: service_started }
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
